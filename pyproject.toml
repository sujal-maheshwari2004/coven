[project]
name = "coven"
version = "0.1.0"
description = "A multi-agent DAG pipeline framework that spawns and coordinates specialized agents to solve complex tasks — with real tool execution via ToolStorePy"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sujal Maheshwari", email = "sujalmaheshwari07@gmail.com" }
]
dependencies = [
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "networkx>=3.3",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "toolstorepy>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/sujal-maheshwari2004/coven"
Repository = "https://github.com/sujal-maheshwari2004/coven"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coven"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]